services:
  postgres:
    image: postgres:16-alpine
    container_name: chamados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chamados_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - chamados_data:/var/lib/postgresql/data
      # Os arquivos abaixo rodam em ordem alfabetica, e apenas na primeira subida
      # do volume. Para recarregar: docker compose down -v && docker compose up -d
      - ./script_tabelas_postgresql.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
      - ./banco/script_dados_demo.sql:/docker-entrypoint-initdb.d/02-dados-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chamados_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chamados_data:
