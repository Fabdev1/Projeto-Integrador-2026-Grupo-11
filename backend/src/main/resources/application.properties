spring.application.name=sistema-chamados-backend

# ---------------------------------------------------------------------------
# Conexao com o PostgreSQL
# Cada pessoa do grupo tem uma senha local diferente. Os valores abaixo aceitam
# variaveis de ambiente e caem no padrao do docker-compose quando nao houver
# nenhuma definida, para que ninguem precise editar este arquivo (e gerar
# conflito no Git) so para rodar na propria maquina.
#
#   export DB_URL=jdbc:postgresql://localhost:5432/chamados_db
#   export DB_USER=postgres
#   export DB_PASSWORD=suasenha
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Datas em ISO-8601 (2026-09-04T14:32:10), lidas direto pelo new Date() do JS
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# Porta do servidor
server.port=${SERVER_PORT:8080}

# Mensagens de erro do Bean Validation no corpo da resposta
server.error.include-message=always
