spring.application.name=sistema-chamados-backend

# ---------------------------------------------------------------------------
# Conexao com o Banco de Dados
# Padrao: H2 em memoria com modo PostgreSQL (roda direto no IntelliJ sem instalar nada).
# Para usar PostgreSQL (Docker ou local), defina as variaveis de ambiente:
#   export DB_URL=jdbc:postgresql://localhost:5432/chamados_db
#   export DB_USER=postgres
#   export DB_PASSWORD=postgres
#   export DB_DRIVER=org.postgresql.Driver
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:chamados_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Console H2 (disponivel em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datas em ISO-8601 (2026-09-04T14:32:10), lidas direto pelo new Date() do JS
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# Porta do servidor
server.port=${SERVER_PORT:8080}

# Mensagens de erro do Bean Validation no corpo da resposta
server.error.include-message=always
