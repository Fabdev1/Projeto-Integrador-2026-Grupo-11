spring.application.name=sistema-chamados-backend

# Configurações de Conexão com o PostgreSQL
# Cada dev pode sobrescrever essas variáveis de ambiente (DB_HOST, DB_PORT, etc.)
# sem precisar alterar este arquivo, caso o Postgres local esteja em outra porta.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chamados_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do Servidor Backend
server.port=8080

# Upload de anexos
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
